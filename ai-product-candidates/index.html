const esc = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const companyCounts = Object.fromEntries(order.map(company => [company, candidates.filter(c => c.company === company).length]));
const priorityCounts = Object.fromEntries(priorityOrder.map(priority => [priority, candidates.filter(c => c.priorityLabel === priority).length]));
const priorities = [...new Set(candidates.map(c => c.priorityLabel).filter(Boolean))];
els.priority.innerHTML += priorities.map(p => `<option>${esc(p)}</option>`).join('');
els.total.textContent = candidates.length;
els.companyCount.textContent = order.filter(company => companyCounts[company]).length;
els.priorityCount.textContent = candidates.filter(c => /^P[12]/.test(c.priority)).length;

function matches(c) { const haystack = Object.values(c).join(' ').toLowerCase(); return (!state.company || c.company === state.company) && (!state.priority || c.priorityLabel === state.priority) && (!state.ability || c.ability === state.ability) && (!state.query || haystack.includes(state.query)); }
function navButton(type, key, label, count, active) { return `<button class="${active ? 'active' : ''}" data-nav-type="${type}" data-nav-key="${esc(key)}"><span>${esc(label)}</span><span class="count">${count}</span></button>`; }
function renderNavs() { const companyButtons = [navButton('company', '', '全部候选人', candidates.length, state.mode === 'company' && !state.company)]; order.forEach(company => { if (companyCounts[company]) companyButtons.push(navButton('company', company, company, companyCounts[company], state.mode === 'company' && state.company === company)); }); els.companyNav.innerHTML = companyButtons.join(''); const priorityButtons = [navButton('priority', '', '全部推荐人选', candidates.length, state.mode === 'priority' && !state.priority)]; priorityOrder.forEach(priority => { if (priorityCounts[priority]) priorityButtons.push(navButton('priority', priority, `${priority} · ${priorityNames[priority]}`, priorityCounts[priority], state.mode === 'priority' && state.priority === priority)); }); els.priorityNav.innerHTML = priorityButtons.join(''); }
function card(c) { const signal = c.aiProduct || c.companySignal || c.school; const school = c.school && c.school !== signal ? c.school : ''; return `<button class="candidate" type="button" data-id="${esc(c.id)}"><div class="card-top"><div><h4>${esc(c.name)}</h4><span class="candidate-id">ID ${esc(c.id || '—')} · 排名 ${esc(c.rank)}</span></div><span class="priority">${esc(c.priorityLabel)}</span></div>${signal ? `<p class="signal">${esc(signal)}</p>` : ''}${school ? `<p class="school">${esc(school)}</p>` : ''}<div class="chips"><span class="chip">${esc(c.ability)}</span></div></button>`; }
function groupMarkup(type, key, label, list) { return `<section class="group" id="${type}-${encodeURIComponent(key)}" data-menu-type="${type}" data-menu-key="${esc(key)}"><div class="group-heading"><h3>${esc(label)}</h3><span>${list.length} 人</span><i class="group-rule"></i></div><div class="cards">${list.map(card).join('')}</div></section>`; }
function render() { renderNavs(); const filtered = candidates.filter(matches); const groups = state.mode === 'priority' ? priorityOrder.map(priority => [priority, filtered.filter(c => c.priorityLabel === priority)]).filter(([, list]) => list.length).map(([priority, list]) => groupMarkup('priority', priority, `${priority} · ${priorityNames[priority]}`, list)) : order.map(company => [company, filtered.filter(c => c.company === company)]).filter(([, list]) => list.length).map(([company, list]) => groupMarkup('company', company, company, list)); els.title.textContent = state.mode === 'priority' ? (state.priority ? `${state.priority} · ${priorityNames[state.priority]}` : '推荐人选') : (state.company || '全部候选人'); els.resultCount.textContent = `当前显示 ${filtered.length} / ${candidates.length} 人`; els.groups.innerHTML = groups.length ? groups.join('') : '<div class="empty">没有符合当前筛选条件的候选人</div>'; requestAnimationFrame(syncActiveNav); }
function detail(c) { document.getElementById('detailPriority').textContent = c.priorityLabel; document.getElementById('detailName').textContent = c.name; document.getElementById('detailMeta').textContent = `ID ${c.id || '—'} · 综合排名 ${c.rank}`; const rows = [['公司','company'],['教育','school'],['大厂经历','companySignal'],['AI / 产品经历','aiProduct'],['0-1 项目线索','zeroOne'],['职级线索','level'],['证据置信度','confidence']].filter(([,key]) => c[key]).map(([label,key]) => `<div class="detail-row"><dt>${label}</dt><dd>${esc(c[key])}</dd></div>`).join(''); const action = c.nextStep ? `<div class="detail-actions"><b>推进建议</b><p>${esc(c.nextStep)}</p></div>` : ''; document.getElementById('detailBody').innerHTML = rows + action; els.dialog.showModal(); }
function setActiveNav(type, key) { document.querySelectorAll(`[data-nav-type="${type}"]`).forEach(button => button.classList.toggle('active', button.dataset.navKey === key)); }
function syncActiveNav() { const sections = [...document.querySelectorAll('.group[data-menu-type]')]; if (!sections.length) return; const marker = 150; let active = sections[0]; for (const section of sections) { if (section.getBoundingClientRect().top <= marker) active = section; else break; } setActiveNav(active.dataset.menuType, active.dataset.menuKey); }
function scrollToGroup(type, key) { const target = document.getElementById(`${type}-${encodeURIComponent(key)}`); if (target) target.scrollIntoView({behavior:'smooth', block:'start'}); }
let scrollScheduled = false;
window.addEventListener('scroll', () => { if (scrollScheduled) return; scrollScheduled = true; requestAnimationFrame(() => { scrollScheduled = false; syncActiveNav(); }); }, {passive:true});
els.companyNav.addEventListener('click', event => { const button = event.target.closest('[data-nav-type="company"]'); if (!button) return; state.mode = 'company'; state.company = button.dataset.navKey; render(); requestAnimationFrame(() => button.dataset.navKey ? scrollToGroup('company', button.dataset.navKey) : document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'})); });
els.priorityNav.addEventListener('click', event => { const button = event.target.closest('[data-nav-type="priority"]'); if (!button) return; state.mode = 'priority'; state.company = ''; state.priority = ''; render(); requestAnimationFrame(() => button.dataset.navKey ? scrollToGroup('priority', button.dataset.navKey) : document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'})); });
els.groups.addEventListener('click', event => { const card = event.target.closest('[data-id]'); if (!card) return; detail(candidates.find(c => String(c.id) === card.dataset.id)); });
els.search.addEventListener('input', event => { state.query = event.target.value.trim().toLowerCase(); render(); });
els.priority.addEventListener('change', event => { state.priority = event.target.value; render(); });
els.ability.addEventListener('change', event => { state.ability = event.target.value; render(); });
els.reset.addEventListener('click', () => { Object.assign(state, {mode:'company',company:'',priority:'',ability:'',query:''}); els.search.value=''; els.priority.value=''; els.ability.value=''; render(); });
document.getElementById('closeDialog').addEventListener('click', () => els.dialog.close());
els.dialog.addEventListener('click', event => { if (event.target === els.dialog) els.dialog.close(); });

render();
document.fonts.ready.then(() => {
  const prepared = new Map();
  for (const el of document.querySelectorAll('[data-pretext]')) prepared.set(el, window.Pretext.prepare(el.textContent, getComputedStyle(el).font));
  function relayout() { for (const [el, handle] of prepared) { const lineHeight = parseFloat(getComputedStyle(el).lineHeight); const layoutResult = window.Pretext.layout(handle, el.clientWidth, Number.isFinite(lineHeight) ? lineHeight : 20); if (layoutResult.height) el.style.minHeight = `${layoutResult.height}px`; } }
  new ResizeObserver(relayout).observe(document.body);
  for (const el of prepared.keys()) { if (el.contentEditable === 'true') new MutationObserver(() => { prepared.set(el, window.Pretext.prepare(el.textContent, getComputedStyle(el).font)); relayout(); }).observe(el, {characterData:true,subtree:true,childList:true}); }
  relayout();
});
  </script>
</body>
</html>
